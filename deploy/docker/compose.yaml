services:
  s3:
    image: ${S3_IMAGE:?Set S3_IMAGE}
    container_name: ${S3_CONTAINER_NAME:-oneai-s3}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      RUSTFS_ADDRESS: :9000
      RUSTFS_VOLUMES: /data
    command: /usr/bin/rustfs
    ports:
      - "127.0.0.1:${S3_PORT:-13215}:9000"
    volumes:
      - ${S3_DATA_VOLUME:-oneai-s3-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  oneai-s3-data:
    name: ${S3_DATA_VOLUME:-oneai-s3-data}
